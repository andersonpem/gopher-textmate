name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # G115: hex color components are 0–255 by construction.
      # G304: library/CLI APIs intentionally read caller-supplied paths.
      - name: gosec
        run: gosec -quiet -exclude=G115,G304 ./...

      - name: Race detector
        run: go test -race ./...

      - name: Fuzz (smoke)
        run: |
          go test ./grammar/ -fuzz=. -fuzztime=10s
          go test ./oniglib/ -fuzz=. -fuzztime=10s
          go test ./theme/ -fuzz=. -fuzztime=10s